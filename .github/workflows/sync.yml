name: Auto-Sync Gachabase IDs

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        # If parser.py uses external modules (like requests), install them here.
        run: |
          python -m pip install --upgrade pip
          # pip install requests
          # pip install -r requirements.txt 

      - name: Run Parser Script
        run: python parser.py

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "remiellecmdgen-bot"
          git config --global user.email "bot@users.noreply.github.com"
          
          # Prevents fatal crash if the python script failed to create the file
          if [ -f gachabase_sync.json ]; then
            git add gachabase_sync.json
            git commit -m "Auto-update Gachabase IDs and icons [skip ci]" || exit 0
            git push
          else
            echo "Error: gachabase_sync.json does not exist. The parser script likely failed silently."
            exit 1
          fi
